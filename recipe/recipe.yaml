schema_version: 1

context:
  name: autowrapt
  version: "2.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/autowrapt-${{ version }}.tar.gz
  sha256: 7cf4b3aa0984d946fa3158284ce3516339491a267884430d9decc5ff20b0269a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}
    - wrapt >=1.10.4

tests:
  - python:
      imports:
        - autowrapt
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check

about:
  summary: Boostrap mechanism for monkey patches.
  license: BSD-2-Clause
  license_file: LICENSE
  homepage: https://github.com/GrahamDumpleton/autowrapt

extra:
  recipe-maintainers:
    - janjagusch
